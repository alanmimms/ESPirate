# ESPirate Zephyr Configuration
# Target: ESP32-S3 (DevKitM / DevKitC)

# Kernel Settings
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# FPU & Standard C Library for Lua
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Console & Shell (UART0 over USB CP2102 Bridge)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="ESPirate> "
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_PRINTF_BUFF_SIZE=512
CONFIG_SHELL_WILDCARD=n

# Hardware control & Utilities
CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Flash & LittleFS Storage Subsystem
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI_FLASH_SUPPORT_BOYA_CHIP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=128

# PSRAM Configuration (8MB Embedded Octal PSRAM)
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304

# Networking & BSD Sockets
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=4
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=4
CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_DATA_SIZE=1280
CONFIG_NET_TCP_TIME_WAIT_DELAY=250
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_ZVFS_POLL_MAX=32
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=500
CONFIG_NET_LOG=y
CONFIG_MDNS_RESPONDER_LOG_LEVEL_INF=y
CONFIG_MDNS_RESPONDER_TTL=15
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_IPV4=y
CONFIG_NET_STATISTICS_UDP=y
CONFIG_NET_STATISTICS_TCP=y
CONFIG_NET_STATISTICS_DNS=y

# DHCPv4 Client & Server
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=y
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"

# Hostname & mDNS Responder
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="espirate"
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME_MAX_LEN=32
CONFIG_MDNS_RESPONDER=y

# Wi-Fi Driver (Exclusive AP or STA Mode)
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=n
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
CONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=y
CONFIG_ESP32_WIFI_WPA3_COMPATIBLE=y
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y
CONFIG_ESP32_WIFI_DEBUG_PRINT=y
CONFIG_SHELL_LOG_LEVEL_DBG=y
CONFIG_LOG_CMDS=y

# Hardware Entropy Source
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_ESP32_RNG=y
